[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnq-renko-research-engine"
version = "0.1.0"
description = "Research engine for MNQ dual synthetic Renko strategy testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
renko-research = "run_engine:main"

[tool.setuptools]
py-modules = ["run_engine"]

[tool.setuptools.packages.find]
include = ["renko_research_engine*"]
